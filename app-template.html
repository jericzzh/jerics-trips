*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--sans);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:10px}
.tnum{font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif);font-optical-sizing:auto}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 2px 6px}
.ph h1{font-family:var(--serif);font-weight:800;font-size:clamp(36px,9vw,48px);letter-spacing:-.02em;line-height:1;margin:0;text-wrap:balance}
.ph .lede{color:var(--ink2);font-size:15px;margin-top:8px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--on-blue);box-shadow:var(--shadow-s);flex:none;transition:transform .2s}
.round:active{transform:scale(.92)}
.round.ghost{background:var(--paper);color:var(--blue)}
.ph .btns{display:flex;gap:10px}

/* illustrated trip pages */
.art{position:absolute;inset:0;overflow:hidden}
.art svg.scene,.art img{width:100%;height:100%;display:block;object-fit:cover}
.page{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);background:var(--paper);isolation:isolate;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.page:active{transform:scale(.985)}
@media (hover:hover){.page:hover{transform:translateY(-3px)}}
.page .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,12,34,0) 35%,rgba(4,12,34,.72) 100%)}
.page .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 18px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.page .cap .nm{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.page .cap .dt{font-size:14px;opacity:.88;margin-top:6px}
.page.hero{height:min(62vh,460px)}
.page.hero .cap .nm{font-size:clamp(30px,8vw,42px)}
.page.std{height:210px}
.page.small{height:150px}
.page.small .cap{padding:12px 14px}
.page.small .cap .nm{font-size:18px}
.page.small .art{filter:saturate(.75)}
.stack{display:grid;gap:16px;margin-top:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(255,255,255,.2);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.chip.solid{background:#fff;color:#0B1530;box-shadow:none}
.toprow{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sec{font-family:var(--serif);font-weight:650;font-size:22px;margin:34px 2px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec .aux{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--ink2)}

/* ring */
.ring{--p:0;width:46px;height:46px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .tr{stroke:rgba(255,255,255,.28)}
.ring .pr{stroke:#fff;stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:calc(113.1 - 113.1*var(--p));transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:700}
.ring.ink .tr{stroke:var(--blue-soft)} .ring.ink .pr{stroke:var(--blue)}

/* trip detail */
.hero-wrap{position:relative;margin-inline:-16px;margin-top:-8px;height:min(56vh,440px);overflow:hidden}
@media (min-width:792px){.hero-wrap{margin-inline:0;border-radius:0 0 28px 28px}}
.hero-wrap .art{transform-origin:50% 100%;will-change:transform}
.hero-wrap .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,12,34,.28) 0%,rgba(4,12,34,0) 26%,rgba(4,12,34,0) 46%,rgba(4,12,34,.78) 100%)}
.hero-wrap .cap{position:absolute;left:20px;right:20px;bottom:22px;color:#fff}
.hero-wrap h1{font-family:var(--serif);font-weight:800;font-size:clamp(32px,8.5vw,48px);line-height:1.02;letter-spacing:-.02em;margin:0;text-wrap:balance;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.hero-wrap .dt{margin-top:8px;font-size:15px;opacity:.9}
.glassbtn{height:40px;min-width:40px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;background:rgba(10,20,45,.32);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.glassbtn .i{width:18px;height:18px}
.hero-wrap .toprow{top:calc(12px + env(safe-area-inset-top,0px))}
.hero-wrap .toprow .r{display:flex;gap:8px}

.summary{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:var(--r);padding:14px 16px;margin-top:-28px;position:relative;z-index:2;box-shadow:var(--shadow-s)}
.summary .txt{flex:1;min-width:0}
.summary .big{font-weight:700;font-size:16px}
.summary .sm{font-size:13px;color:var(--ink2);margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fact{background:var(--paper);border-radius:14px;padding:8px 12px;font-size:13px;color:var(--ink2);display:flex;align-items:baseline;gap:5px}
.fact b{font-size:17px;color:var(--ink)}
.fact.warn b{color:var(--amber)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:46px;padding:0 18px;border-radius:14px;font-weight:650;font-size:16px;background:var(--blue);color:var(--on-blue);transition:transform .15s,opacity .2s;box-shadow:var(--shadow-s)}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--blue-soft);color:var(--blue);box-shadow:none}
.btn.danger{background:rgba(217,54,54,.1);color:var(--red);box-shadow:none}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;border-radius:10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.note-banner{background:var(--blue-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.note-banner .i{color:var(--blue);margin-top:1px}

/* day pages */
.day{margin-top:26px}
.dayband{position:relative;height:84px;border-radius:18px 18px 0 0;overflow:hidden}
.dayband .scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,12,34,.62),rgba(4,12,34,.05) 70%)}
.dayband .lbl{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:#fff}
.dayband .d1{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.1}
.dayband .d2{font-size:13px;opacity:.88;margin-top:3px}
.dayband .today{position:absolute;right:12px;top:12px}
.daybody{background:var(--paper);border-radius:0 0 18px 18px;box-shadow:var(--shadow-s);overflow:hidden}
.night{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:9px 16px;border-top:1px solid var(--line);background:var(--fill)}
.night .i{width:15px;height:15px;color:var(--blue)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:52px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:62px;border-top:1px solid var(--line)}
button.row:active{background:var(--fill)}
@media (hover:hover){button.row:hover{background:var(--fill)}}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:14px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row .muted{color:var(--ink2);font-weight:500}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 4px 10px -4px currentColor}
.ico .i{width:18px;height:18px;color:#fff}
.ico.ghost{background:var(--fill)!important;box-shadow:none}
.ico.ghost .i{color:var(--ink3)}
.times{text-align:right;flex:none;font-size:14px;line-height:1.35}
.times .a{font-weight:600}
.times .b{color:var(--ink2)}
.times sup{font-size:10px;margin-left:1px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin-right:5px;vertical-align:1px;text-transform:uppercase}
.tag.tbd{background:var(--amber-soft);color:var(--amber)}
.tag.hold{background:rgba(120,120,120,.16);color:var(--ink2)}
.btnrow{display:flex;gap:6px;flex-shrink:0}
.tag.gm{background:var(--blue-soft);color:var(--blue)}
.tag.cost{background:var(--green-soft);color:var(--green)}

/* generic cards / lists */
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow-s);overflow:hidden}
.card+.card{margin-top:12px}
.empty{text-align:center;padding:40px 20px}
.empty h2{font-family:var(--serif);font-size:26px;margin:16px 0 6px}
.empty p{color:var(--ink2);margin:0 auto 20px;max-width:36ch}
.empty .pic{height:180px;border-radius:24px;overflow:hidden;position:relative;box-shadow:var(--shadow)}

/* chips row */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pick{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px 0 4px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow-s);font-weight:600;font-size:14px;white-space:nowrap}
.pick.np{padding-left:14px}
.pick .thumb{width:32px;height:32px;border-radius:50%;overflow:hidden;position:relative;flex:none}
.pick[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}

/* map */
.mapcard{position:relative;border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);height:min(58vh,480px);background:var(--water)}
#mapbox{position:absolute;inset:0;background:var(--water);font-family:var(--sans)}
.leaflet-container{background:var(--water)!important;font:inherit}
path.land{fill:var(--land);stroke:var(--land-line);stroke-width:.8}
path.route{stroke:var(--blue);stroke-width:3.5;fill:none;stroke-dasharray:9 9;animation:march 1.2s linear infinite;stroke-linecap:round}
path.route-glow{stroke:var(--blue);stroke-opacity:.18;stroke-width:12;fill:none;stroke-linecap:round}
@keyframes march{to{stroke-dashoffset:-18}}
.pin{display:grid;place-items:center}
.pin span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;border:2.5px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.35);animation:drop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes drop{from{transform:translateY(-14px) scale(.6)}to{transform:none}}
.leaflet-popup-content-wrapper{background:var(--paper);color:var(--ink);border-radius:14px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--paper)}
.leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.4}
.leaflet-popup-content b{font-size:15px}
.leaflet-control-zoom a{background:var(--paper)!important;color:var(--ink)!important;border-color:var(--line)!important}
.mapnote{position:absolute;left:12px;right:12px;bottom:12px;z-index:500;display:flex;gap:10px;align-items:center;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:14px;padding:10px 12px;font-size:14px;box-shadow:var(--shadow-s)}
.mapnote .tx{flex:1;min-width:0}
.stop-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.credit{font-size:11px;color:var(--ink3);margin:6px 4px 0;text-align:right}

/* expenses */
.bignum{font-family:var(--serif);font-weight:800;font-size:40px;letter-spacing:-.02em;line-height:1.05}
.bars{display:grid;gap:12px;padding:16px}
.bar .top{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px;gap:8px}
.bar .top b{font-weight:650}
.bar .track{height:10px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar .fillr{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--blue-2));width:var(--w);animation:grow 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{width:4%}}
.who{display:inline-flex;margin-left:6px;vertical-align:middle}
.av{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;margin-left:-5px;border:2px solid var(--paper)}
.av:first-child{margin-left:0}

/* inbox */
.mail{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.mail+.mail{border-top:1px solid var(--line)}
.mail .body{flex:1;min-width:0}
.mail .k{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue)}
.mail .t{font-weight:650;margin-top:2px}
.mail .s{font-size:14px;color:var(--ink2);margin-top:3px;overflow-wrap:anywhere}
.mail .src{font-size:12px;color:var(--ink3);margin-top:6px;overflow-wrap:anywhere}
.mail .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mail.done{opacity:.6}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:2px;padding:6px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:var(--shadow),inset 0 0 0 1px var(--line);max-width:calc(100% - 24px)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:7px 8px 6px;border-radius:999px;font-size:10.5px;font-weight:650;color:var(--ink2);transition:color .25s,background .3s}
.tab .i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
.tab .dot{position:absolute;top:3px;right:14px;min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
@media (max-width:380px){.tab{min-width:54px;padding-inline:4px}}

/* sheets */
.scrimx{position:fixed;inset:0;background:rgba(3,10,30,.42);z-index:40;opacity:0;transition:opacity .3s}
.scrimx.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:var(--shadow);transform:translateY(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
@media (min-width:800px){.sheet{left:50%;right:auto;width:640px;bottom:auto;top:50%;max-height:88%;border-radius:24px;transform:translate(-50%,-44%) scale(.97);opacity:0;transition:transform .3s,opacity .3s}.sheet.on{transform:translate(-50%,-50%);opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--ink3);margin:8px auto 0;flex:none}
@media (min-width:800px){.grab{display:none}}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;flex:none;min-height:50px}
.shead .ttl{font-weight:700;font-size:17px;flex:1;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shead .tb{color:var(--blue);font-size:16px;padding:10px 8px;border-radius:10px;min-width:64px}
.shead .tb.r{text-align:right;font-weight:700}
.scontent{overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
.slbl{font-size:13px;font-weight:650;color:var(--ink2);margin:20px 4px 7px;text-transform:uppercase;letter-spacing:.05em}
.fields{background:var(--paper);border-radius:16px;overflow:hidden}
.f{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative}
.f+.f::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:1px solid var(--line)}
.f>label{flex:none;width:100px;font-size:16px}
.f input,.f select,.f textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);padding:12px 0;text-align:right}
.f input::placeholder,.f textarea::placeholder{color:var(--ink3)}
.f input:focus-visible,.f textarea:focus-visible,.f select:focus-visible{outline:none;box-shadow:inset 0 -2px 0 var(--blue);border-radius:0}
.f select{appearance:none;-webkit-appearance:none;color:var(--ink2);cursor:pointer;text-align-last:right}
.f.stack{flex-direction:column;align-items:stretch;padding:10px 16px}
.f.stack textarea{text-align:left;min-height:96px;resize:vertical;padding:4px 0}
.f .pair{flex:1;display:flex;gap:8px;justify-content:flex-end;min-width:0;flex-wrap:wrap}
.f .pair input{flex:0 1 auto;text-align:center;background:var(--fill);border-radius:9px;padding:7px 8px;max-width:150px}
.f .money{flex:1;display:flex;gap:8px;justify-content:flex-end;align-items:center}
.f .money input{max-width:130px}
.f .money select{flex:0 0 auto;max-width:90px;color:var(--ink)}
.switch{position:relative;width:51px;height:31px;flex:none;margin-left:auto}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--fill);border-radius:999px;transition:background .2s;pointer-events:none;box-shadow:inset 0 0 0 1px var(--line)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch input:checked+span{background:var(--blue)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2.5px solid var(--blue);outline-offset:2px}
.kinds{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.kind{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;background:var(--paper);font-size:12px;font-weight:600;color:var(--ink2);transition:transform .15s}
.kind:active{transform:scale(.95)}
.kind[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue);color:var(--ink)}
.people{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px}
.person{height:34px;padding:0 13px;border-radius:999px;background:var(--fill);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.person[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.person.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--blue)}
.hint{font-size:13px;color:var(--ink2);padding:7px 4px 0}
.dhead{display:flex;gap:14px;align-items:center;padding:6px 0 4px}
.dhead .ico{width:54px;height:54px;border-radius:16px}
.dhead .ico .i{width:26px;height:26px}
.dhead h2{font-family:var(--serif);font-size:24px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.kv .row{align-items:flex-start;min-height:46px}
.kv .row::before{left:16px!important}
.kv .k{color:var(--ink2);font-size:14px;width:104px;flex:none;padding-top:2px}
.kv .v{flex:1;min-width:0;font-size:16px;overflow-wrap:anywhere}
.notes{white-space:pre-wrap;font-size:15px;line-height:1.5;padding:12px 16px;overflow-wrap:anywhere}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 16px}
.route .end{min-width:0}.route .end.r{text-align:right}
.route .code{font-family:var(--serif);font-size:30px;font-weight:800;line-height:1.05;overflow-wrap:anywhere}
.route .when{font-size:14px;color:var(--ink2);margin-top:3px}
.route .tz{font-size:12px;color:var(--ink3)}
.route .mid{color:var(--blue)}
.confirm{display:flex;gap:10px;margin-top:10px}.confirm .btn{flex:1}
.copyline{display:flex;gap:8px;align-items:center;padding:12px 16px}
.copyline code{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere;user-select:all}
.photo-prev{height:150px;border-radius:14px;overflow:hidden;position:relative;margin:12px 16px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--blue-soft);border-top-color:var(--blue);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}


.leaflet-tooltip.lbl{background:var(--paper);color:var(--ink);border:0;box-shadow:var(--shadow-s);font:600 12px/1.2 var(--sans);padding:4px 8px;border-radius:8px;white-space:nowrap}

    if (s && (!a || s < a)) a = s;

let chain = Promise.resolve();
function queue(fn, fail){ chain = chain.then(fn).catch(e => { if (e && e.code === "invalid_argument") { S.canWrite = false; render(); toast("You can view this trip but not edit it."); } else toast(e && e.code === "quota_exceeded" ? "Storage is full. Delete an old trip to make room." : (fail || "Couldn't save. Check your connection and try again.")); }); return chain; }
function persist(t){
  if (!S.db) { toast("Sign in to claude.ai to save changes."); return Promise.resolve(); }
  const body = JSON.parse(JSON.stringify(t)); delete body.id; body.updatedAt = Date.now();
  const i = S.trips.findIndex(x => x.id === t.id), local = {...body, id:t.id};

  const shareNote = S.mode === "share" && S.snapAt ? ` Updated ${new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(S.snapAt))}.` : "";
  let html = `<div class="ph"><div><h1>${S.mode === "share" ? h(S.snapTitle || "Trips") : "Trips"}</h1><div class="lede">${h(lede + shareNote)}</div></div><div class="btns">${S.dbState==="on" && S.mode==="app"?`<button class="round" data-act="new-trip" aria-label="New trip">${ic("plus")}</button>`:""}</div></div>`;

let sheetEl, scrimEl, lastFocus;
function openSheet(html, mount){

  scrimEl.onclick = () => closeSheet();
  requestAnimationFrame(() => { scrimEl.classList.add("on"); sheetEl.classList.add("on"); });
  document.body.style.overflow = "hidden";
  mount && mount(sheetEl);
  const f = sheetEl.querySelector("[autofocus]"); if (f && matchMedia("(hover:hover)").matches) setTimeout(() => f.focus(), 300);
}
function setSheet(html, mount){ if (!sheetEl) return openSheet(html, mount); sheetEl.innerHTML = `<div class="grab"></div>` + html; mount && mount(sheetEl); }
function closeSheet(instant){
  if (!sheetEl) return; const s = sheetEl, c = scrimEl; sheetEl = scrimEl = null; document.body.style.overflow = "";
  if (instant) { s.remove(); c.remove(); return; }

function resizeImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 1100, sc = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas"); c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .8, out = c.toDataURL("image/jpeg", q); while (out.length > 230000 && q > .35) { q -= .1; out = c.toDataURL("image/jpeg", q); } res(out); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

  const mount = el => {
    let kind = d.kind, stt = itemState(d);
    const drawPeople = () => { el.querySelector("#ppl").innerHTML = people.map(p => `<button type="button" class="person" data-p="${h(p)}" aria-pressed="${joined.has(p)}">${h(nameOf(p))}</button>`).join("") + `<button type="button" class="person add" data-x="addp">${ic("plus",'style="width:14px;height:14px"')}Add</button>`; };
    drawPeople();
    const sync = () => {
      el.querySelectorAll(".kind").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === kind));
      const mv = MOVING.has(kind);
      el.querySelectorAll('[data-for="move"]').forEach(f => f.hidden = !mv);
      el.querySelectorAll('[data-for="carrier"]').forEach(f => f.hidden = !(mv || kind === "stay"));
      el.querySelector("#l-start").textContent = kind==="stay" ? "Check in" : mv ? "Departs" : "Starts";
      el.querySelector("#l-end").textContent = kind==="stay" ? "Check out" : mv ? "Arrives" : "Ends";
      el.querySelector("#i-title").placeholder = {flight:"Flight to Hong Kong", stay:"Hotel name", dining:"Restaurant", note:"Reminder", train:"Train to Fes", transfer:"Car to hotel", ferry:"Ferry", activity:"Museum, tour, show…"}[kind];
    };
    sync();
    el.onclick = e => {
      const b = e.target.closest("[data-x],[data-k],[data-p],[data-st]"); if (!b) return;
      if (b.dataset.st) { stt = b.dataset.st; el.querySelectorAll("[data-st]").forEach(x => x.setAttribute("aria-pressed", x.dataset.st === stt)); return; }
      if (b.dataset.k) { kind = b.dataset.k; sync(); return; }
      if (b.dataset.p) { const p = b.dataset.p; joined.has(p) ? joined.delete(p) : joined.add(p); b.setAttribute("aria-pressed", joined.has(p)); return; }
      const x = b.dataset.x;
      if (x === "addp") { const zone = el.querySelector("#ppl"); if (zone.querySelector("#np")) return; b.insertAdjacentHTML("beforebegin", `<input id="np" class="person" style="width:120px;border:0;outline:none" placeholder="Name" aria-label="New person's name">`); const np = zone.querySelector("#np"); np.focus();
        const commit = () => { const v = np.value.trim(); if (v && !/^(me|you)$/i.test(v) && !people.includes(v)) { people.push(v); joined.add(v); } drawPeople(); };
        np.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); commit(); } }); np.addEventListener("blur", commit); return; }
      if (x === "cancel") return inPlace ? openItem(t, it.id) : closeSheet();
      if (x === "del") { el.querySelector("#del-zone").innerHTML = `<div class="confirm"><button type="button" class="btn soft" data-x="keep">Keep</button><button type="button" class="btn" style="background:var(--red);color:#fff" data-x="del-yes">Delete</button></div>`; return; }
      if (x === "keep") { el.querySelector("#del-zone").innerHTML = `<button type="button" class="btn danger block" data-x="del">Delete</button>`; return; }
      if (x === "del-yes") { closeSheet(); persist({...t, items:(t.items||[]).filter(i => i.id !== it.id)}); toast("Deleted"); return; }
      if (x === "save") save();
    };
    el.querySelector("#if").onsubmit = e => { e.preventDefault(); save(); };
    function save(){
      const v = id => el.querySelector(id).value.trim(), mv = MOVING.has(kind);
      const title = v("#i-title") || (mv && v("#i-to") ? `${KL[kind]} to ${v("#i-to")}` : "");
      if (!title) { const n = el.querySelector("#i-title"); n.focus(); n.placeholder = "Add a title"; return; }
      const sd = v("#i-sd"), st = v("#i-st"); let ed = v("#i-ed"); const et = v("#i-et"); if (!ed && et && sd) ed = sd;
      const moved = (a,b) => (a||"") !== (b||"");
      const out = {...d, id: d.id || uid(), kind, title,
        start: sd ? sd + (st ? "T"+st : "") : "", end: ed ? ed + (et ? "T"+et : "") : "",
        tz: v("#i-tz"), endTz: mv ? v("#i-etz") : "", from: mv ? v("#i-from") : "", to: mv ? v("#i-to") : "",
        company: (mv||kind==="stay") ? v("#i-co") : "", number: (mv||kind==="stay") ? v("#i-no") : "",
        location: v("#i-loc"), confirmation: v("#i-conf"), notes: el.querySelector("#i-notes").value.trim(), tbd: stt === "tbd" || stt === "hold", tentative: stt === "tentative", hold: stt === "hold", walkin: stt === "walkin",
        people:[...joined].filter(p => people.includes(p)) };
      if (moved(out.location, d.location) || moved(out.title, d.title)) { delete out.lat; delete out.lng; }
      if (moved(out.from, d.from)) { delete out.fromLat; delete out.fromLng; }
      if (moved(out.to, d.to)) { delete out.toLat; delete out.toLng; }
      const items = (t.items||[]).filter(i => i.id !== out.id); items.push(out);
      const nt = {...t, items, people:[...new Set([...(t.people||["Me"]), ...people])]};
      if (out.start) { const s = dOf(out.start); if (!nt.startDate || s < nt.startDate) nt.startDate = s; const e = out.kind === "stay" ? s : (dOf(out.end)||s); if (!nt.endDate || e > nt.endDate) nt.endDate = e; }
      closeSheet(); persist(nt); toast(isNew ? "Added" : "Saved");
    }
  };
  inPlace ? setSheet(html, mount) : openSheet(html, mount);
}

/* ---------- share ---------- */
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const c = btn && btn.closest(".copyline") && btn.closest(".copyline").querySelector("code"); if (c) { const r = document.createRange(); r.selectNodeContents(c); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Copy it from the menu."); } }
}
function openShare(t){
  const ask = `Share my "${t.name}" trip so friends can see it`;
  openSheet(`${shead(`<span></span>`, "Share", `<button class="tb r" data-x="close">Done</button>`)}
    <div class="scontent">
      <div class="photo-prev" style="margin:4px 0 0;height:120px"><div class="art">${coverArt(t)}</div></div>
      <div class="slbl">Just this trip</div>
      ${t.sharedUrl ? `<div class="card"><div class="copyline"><code>${h(t.sharedUrl)}</code><button class="btn sm soft" data-copy="${h(t.sharedUrl)}">${ic("copy")}Copy</button></div></div>
        <p class="hint">Open the shared trip, then use its Share menu to invite friends. Pick Viewer for view only, or Editor so they can make changes.</p>
        <div class="actions"><a class="btn soft" href="${h(t.sharedUrl)}" target="_blank" rel="noopener">${ic("ext")}Open Shared Trip</a></div>`
      : `<div class="card" style="padding:14px 16px"><p style="margin:0 0 10px">Claude makes ${h(t.name)} its own page with its own link, so friends see only this trip. Ask Claude:</p><div class="copyline" style="padding:0"><code>${h(ask)}</code><button class="btn sm soft" data-copy="${h(ask)}">${ic("copy")}Copy</button></div></div>
        <p class="hint">On that page's Share menu you choose Viewer (view only) or Editor (can change plans) for each friend.</p>`}
      <div class="slbl">Your whole app</div>
      <div class="card" style="padding:14px 16px">Use the Share menu at the top of this page. Friends you add as Viewer can look through every trip. Friends you invite by email as Editor can also make changes.</div>
      <p class="hint">Friends need a claude.ai account to open shared links.</p>
    </div>`, el => { el.onclick = e => { const b = e.target.closest("[data-x],[data-copy]"); if (!b) return; if (b.dataset.copy) return copy(b.dataset.copy, b); if (b.dataset.x === "close") closeSheet(); }; });
}

/* ---------- inbox actions ---------- */
function resolveEntry(m, resolution, extra){
  Object.assign(m, {reviewed:true, resolution}, extra || {}); S.ignoring = null; render();
  queue(() => S.db.collection("inbox").doc(m.id).update({reviewed:true, resolution, resolvedAt:Date.now(), ...(extra || {})}), "Couldn't update the inbox. Try again.");
}
function inboxOk(id, silent){
  const m = inboxEntry(id); if (!m) return; const {t, it} = entryTrip(m);
  if (it && it.review && !mirror(t)) updateItem(t, it.id, {review:false});
  resolveEntry(m, "ok"); if (!silent) toast("Confirmed");
}
function inboxTentative(id){
  const m = inboxEntry(id); if (!m) return; const {t, it} = entryTrip(m);
  if (it && !mirror(t)) updateItem(t, it.id, {review:false, tentative:true, tbd:false});
  resolveEntry(m, "tentative"); toast("Kept as tentative. It's on your To Book list to finalize.");
}
function inboxIgnore(id){
  const m = inboxEntry(id); if (!m) return; const {t, it} = entryTrip(m);
  if (t && it && !mirror(t)) {
    if (m.action === "added") persist({...t, items:(t.items||[]).filter(i => i.id !== it.id)});
    else if (m.before && typeof m.before === "object") persist({...t, items:(t.items||[]).map(i => i.id === it.id ? {...m.before, id:it.id, review:false} : i)});
    else if (it.review) updateItem(t, it.id, {review:false});
  }
  resolveEntry(m, "ignored"); toast(m.action === "added" ? "Removed from the trip" : "Ignored");
}
function reviewAll(){ const ids = S.inbox.filter(m => inboxPending(m) && m.action !== "unmatched" && !isCancel(m)).map(m => m.id); ids.forEach(id => inboxOk(id, true)); toast(`${ids.length} confirmed`); }
function attachTo(m, t){
  const src = m.item || {};
  const item = {...src, id: src.id || ("gm-" + uid().slice(0,8)), review:false, people: src.people && src.people.length ? src.people : (t.people || ["Me"]).slice()};
  const nt = {...t, items:(t.items||[]).filter(i => i.id !== item.id).concat(item)};
  const s = dOf(item.start), e = item.kind === "stay" ? s : (dOf(item.end) || s);
  if (s && (!nt.startDate || s < nt.startDate)) nt.startDate = s;
  if (e && (!nt.endDate || e > nt.endDate)) nt.endDate = e;
  persist(nt); resolveEntry(m, "added", {tripId:t.id, tripName:t.name, itemId:item.id}); toast(`Added to ${t.name}`);
}
function inboxAttach(id){
  const m = inboxEntry(id); if (!m || !m.item) return;
  const it = m.item, d0 = dOf(it.start), d1 = (it.kind === "stay" ? dOf(it.end) : dOf(it.end)) || d0;
  const list = S.trips.filter(t => status(t).key !== "past").map(t => { const [a,b] = tripSpan(t); const gap = a && d0 ? Math.max(0, dayDiff(b, d0), dayDiff(d1, a)) : 999; return {t, gap}; }).sort((x,y) => x.gap - y.gap || (tripSpan(x.t)[0]||"9").localeCompare(tripSpan(y.t)[0]||"9"));
  openSheet(`${shead(`<button class="tb" data-x="cancel">Cancel</button>`, "Add to a Trip", "")}
    <div class="scontent">
      <div class="card" style="padding:12px 16px;margin-top:4px"><div style="font-weight:650">${h(it.title || m.title)}</div>${m.details ? `<div class="hint" style="padding:3px 0 0">${h(m.details)}</div>` : ""}</div>
      <div class="slbl">Choose a trip</div>
      ${list.length ? `<div class="card">${list.map(({t, gap}) => `<button class="row" data-pick="${h(t.id)}"><span class="tthumb">${coverArt(t)}</span><span class="body"><div class="t">${h(t.name)}</div><div class="s tnum">${h(fmtRange(...tripSpan(t)))}</div></span>${gap <= 2 ? `<span class="tag gm">Same dates</span>` : ""}</button>`).join("")}</div>` : `<p class="hint">No upcoming trips yet.</p>`}
      <div class="actions"><button class="btn soft block" data-x="new">${ic("plus")}Start a New Trip With It</button></div>
    </div>`, el => { el.onclick = e => { const b = e.target.closest("[data-x],[data-pick]"); if (!b) return;
      if (b.dataset.x === "cancel") return closeSheet();
      if (b.dataset.pick) { const t = tripById(b.dataset.pick); closeSheet(); if (t) attachTo(m, t); return; }
      if (b.dataset.x === "new") { closeSheet(); editTrip(null, {startDate:d0, endDate:d1}, nt => attachTo(m, nt)); } }; });
}

/* ======================= boot ======================= */
const SNAP = document.getElementById("snapshot-data");
let snap = null; if (SNAP) { try { snap = JSON.parse(SNAP.textContent); } catch {} }
if (snap && Array.isArray(snap.trips)) {
  S.mode = "share"; S.dbState = "on"; S.canWrite = false; S.trips = snap.trips; S.photos = snap.photos || {}; S.snapAt = snap.updatedAt; S.snapTitle = snap.title;
  if (!["trips","map"].includes(S.tab)) S.tab = "trips";
  render();
  return;
}
render();
const fail = () => { S.mode = S.mode || "app"; S.dbState = "off"; render(); };
if (window.claude && claude.use) {
  claude.use("db").then(db => {
    if (!db) return fail();
    S.db = db;
    db.collection("meta").onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => m[d.id] = d.data()); S.meta = m;
      const isTrip = m.app && m.app.mode === "trip" && m.app.tripId;
      S.mode = isTrip ? "trip" : "app"; S.lockedTripId = isTrip ? m.app.tripId : null;
      if (isTrip && !["trips","map","tobook"].includes(S.tab)) S.tab = "trips";
      sweepInbox(); render();
    }, () => { S.mode = S.mode || "app"; render(); });
    db.collection("trips").onSnapshot(snap => { S.trips = snap.docs.map(d => ({...d.data(), id:d.id})); S.dbState = "on"; sweepInbox(); render(); },
      () => { S.dbState = S.trips.length ? "on" : "off"; render(); toast("Lost connection to your trips. Reload to reconnect."); });
    db.collection("photos").onSnapshot(snap => { const p = {}; snap.docs.forEach(d => p[d.id] = d.data()); S.photos = p; render(); }, () => {});
    db.collection("inbox").orderBy("createdAt","desc").limit(200).onSnapshot(snap => { S.inbox = snap.docs.map(d => ({...d.data(), id:d.id})); sweepInbox(); render(); }, () => {});
  }).catch(fail);
  claude.use("user").then(async u => { if (!u) return; try { const w = await u.can("data.write"); if (w === false) { S.canWrite = false; render(); } } catch {} }).catch(() => {});
  claude.use("sample").then(s => { S.sample = s || null; if (S.tab === "map") render(); }).catch(() => {});
} else fail();
})();
</script>
